name: Tournament Bot

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure minimum active tournaments
        run: |
          RESPONSE=$(curl -sf \
            -H "X-Admin-Key: ${{ secrets.TOURNAMENT_BOT_KEY }}" \
            https://colegio.cz/api/tournament_bot.php)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok": true' || exit 1
