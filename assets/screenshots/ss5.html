<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1290px; height: 2796px;
  background: #06060F;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  display: flex; flex-direction: column;
  align-items: center;
  overflow: hidden;
  position: relative;
}
body::before {
  content: '';
  position: absolute;
  bottom: 600px; left: 50%; transform: translateX(-50%);
  width: 900px; height: 600px;
  background: radial-gradient(ellipse, rgba(0,158,115,0.07) 0%, transparent 70%);
  pointer-events: none;
}

.top-section { width: 100%; padding: 160px 100px 60px; flex-shrink: 0; }
.eyebrow { font-size: 36px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #009E73; margin-bottom: 32px; }
.headline { font-size: 120px; font-weight: 900; line-height: 1.0; color: #F0F0F8; letter-spacing: -0.03em; margin-bottom: 40px; }
.headline span { color: #F0E442; }
.subline { font-size: 48px; font-weight: 400; color: rgba(240,240,248,0.5); line-height: 1.4; }

/* Big game board — clean, no distractions */
.board-section {
  flex: 1; width: 100%;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 0 100px;
  gap: 18px;
}

.board-label {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  padding: 0 8px; margin-bottom: 8px;
}
.bl-left { font-size: 32px; font-weight: 700; color: rgba(240,240,248,0.3); letter-spacing: 0.1em; text-transform: uppercase; }
.bl-right { font-size: 32px; font-weight: 700; color: rgba(240,240,248,0.3); }

.game-row {
  width: 100%;
  display: grid;
  grid-template-columns: 60px repeat(4, 1fr) 80px;
  gap: 16px;
  align-items: center;
  padding: 20px 24px;
  border-radius: 28px;
}
.game-row.past { background: rgba(255,255,255,0.03); }
.game-row.current {
  background: rgba(240,228,66,0.07);
  border: 2px solid rgba(240,228,66,0.25);
}
.game-row.future { opacity: 0.35; }

.row-num { font-size: 28px; font-weight: 600; color: rgba(240,240,248,0.25); text-align: center; }
.peg { width: 100%; aspect-ratio: 1; border-radius: 50%; }
.peg-e { width: 100%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,0.06); border: 3px dashed rgba(255,255,255,0.15); }

.fb { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; width: 68px; height: 68px; }
.dot { border-radius: 50%; }
.dot.w { background: #fff; }
.dot.g { background: rgba(255,255,255,0.4); }
.dot.e { background: rgba(255,255,255,0.1); }

/* No-wifi badge */
.offline-badge {
  display: flex; align-items: center; gap: 20px;
  background: rgba(0,158,115,0.12);
  border: 1.5px solid rgba(0,158,115,0.3);
  border-radius: 100px;
  padding: 18px 40px;
  margin: 0 100px;
  flex-shrink: 0;
}
.offline-icon { font-size: 44px; }
.offline-text { font-size: 34px; font-weight: 600; color: rgba(240,240,248,0.65); }
.offline-text strong { color: #F0F0F8; }

.bottom-label { width: 100%; padding: 48px 100px; display: flex; align-items: center; flex-shrink: 0; }
.app-name { font-size: 38px; font-weight: 800; color: rgba(240,240,248,0.25); letter-spacing: 0.04em; }
</style>
</head>
<body>

<div class="top-section">
  <div class="eyebrow">Mastermind</div>
  <div class="headline">Anytime,<br>Anywhere.<br><span>Always On.</span></div>
  <div class="subline">No signal? The game never stops. Scores sync when you're back online.</div>
</div>

<div class="board-section">
  <div class="board-label">
    <div class="bl-left">Classic · Medium</div>
    <div class="bl-right">Attempt 4 / 10</div>
  </div>

  <!-- Row 1 - past -->
  <div class="game-row past">
    <div class="row-num">1</div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#f0b429,#E69F00)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#7dd3fc,#56B4E9)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#34d399,#009E73)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#f9a8d4,#CC79A7)"></div>
    <div class="fb"><div class="dot w"></div><div class="dot g"></div><div class="dot e"></div><div class="dot e"></div></div>
  </div>

  <!-- Row 2 - past -->
  <div class="game-row past">
    <div class="row-num">2</div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#34d399,#009E73)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#f0b429,#E69F00)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#93c5fd,#0072B2)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#7dd3fc,#56B4E9)"></div>
    <div class="fb"><div class="dot w"></div><div class="dot w"></div><div class="dot g"></div><div class="dot e"></div></div>
  </div>

  <!-- Row 3 - past -->
  <div class="game-row past">
    <div class="row-num">3</div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#34d399,#009E73)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#fef08a,#F0E442)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#93c5fd,#0072B2)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#f0b429,#E69F00)"></div>
    <div class="fb"><div class="dot w"></div><div class="dot w"></div><div class="dot w"></div><div class="dot e"></div></div>
  </div>

  <!-- Row 4 - current -->
  <div class="game-row current">
    <div class="row-num">4</div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#34d399,#009E73)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#fef08a,#F0E442)"></div>
    <div class="peg" style="background:radial-gradient(circle at 35% 30%,#f0b429,#E69F00)"></div>
    <div class="peg-e"></div>
    <div class="fb"></div>
  </div>

  <!-- Row 5-7 - future (faded) -->
  <div class="game-row future">
    <div class="row-num">5</div>
    <div class="peg-e"></div><div class="peg-e"></div><div class="peg-e"></div><div class="peg-e"></div>
    <div class="fb"></div>
  </div>
  <div class="game-row future">
    <div class="row-num">6</div>
    <div class="peg-e"></div><div class="peg-e"></div><div class="peg-e"></div><div class="peg-e"></div>
    <div class="fb"></div>
  </div>
  <div class="game-row future">
    <div class="row-num">7</div>
    <div class="peg-e"></div><div class="peg-e"></div><div class="peg-e"></div><div class="peg-e"></div>
    <div class="fb"></div>
  </div>
</div>

<div class="offline-badge">
  <div class="offline-icon">✈️</div>
  <div class="offline-text"><strong>Plane, subway, no signal</strong> — game runs offline. Scores sync when you reconnect.</div>
</div>

<div class="bottom-label">
  <div class="app-name">MASTERMIND: CODE BREAKER</div>
</div>

</body>
</html>
