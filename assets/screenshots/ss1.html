<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1290px; height: 2796px;
  background: #06060F;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  display: flex; flex-direction: column;
  align-items: center;
  overflow: hidden;
}

/* BACKGROUND GLOW */
body::before {
  content: '';
  position: absolute;
  top: -200px; left: 50%; transform: translateX(-50%);
  width: 900px; height: 900px;
  background: radial-gradient(ellipse, rgba(240,228,66,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.top-section {
  width: 100%;
  padding: 160px 100px 80px;
  flex-shrink: 0;
}

.eyebrow {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #E69F00;
  margin-bottom: 32px;
}

.headline {
  font-size: 140px;
  font-weight: 900;
  line-height: 1.0;
  color: #F0E442;
  letter-spacing: -0.03em;
  text-wrap: balance;
  margin-bottom: 40px;
}

.subline {
  font-size: 52px;
  font-weight: 400;
  color: rgba(240,240,248,0.55);
  line-height: 1.4;
}

.phone-wrap {
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 0;
  width: 100%;
}

.phone-frame {
  width: 620px;
  background: #111122;
  border-radius: 90px 90px 0 0;
  border: 5px solid rgba(255,255,255,0.12);
  border-bottom: none;
  padding: 50px 44px 0;
}

.phone-screen {
  background: #08081a;
  border-radius: 50px 50px 0 0;
  padding: 44px 38px 0;
}

.screen-title {
  font-size: 28px;
  font-weight: 700;
  color: rgba(240,240,248,0.4);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 28px;
}

.game-row {
  display: grid;
  grid-template-columns: repeat(4, 80px) 72px;
  gap: 16px;
  align-items: center;
  background: rgba(255,255,255,0.03);
  border-radius: 24px;
  padding: 16px 20px;
  margin-bottom: 14px;
}
.game-row.active {
  background: rgba(240,228,66,0.07);
  border: 2px solid rgba(240,228,66,0.25);
}

.peg {
  width: 80px; height: 80px;
  border-radius: 50%;
}
.peg-empty {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
  border: 3px dashed rgba(255,255,255,0.18);
}

.fb-grid {
  display: grid;
  grid-template-columns: 28px 28px;
  gap: 8px;
}
.dot { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.1); }
.dot.black { background: #fff; }
.dot.gray  { background: rgba(255,255,255,0.45); }

.color-picker {
  display: flex;
  justify-content: center;
  gap: 18px;
  padding: 28px 0 0;
}
.cp-peg { width: 64px; height: 64px; border-radius: 50%; }

.bottom-label {
  width: 100%;
  padding: 48px 100px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.app-name {
  font-size: 38px;
  font-weight: 800;
  color: rgba(240,240,248,0.25);
  letter-spacing: 0.04em;
}
.store-badge {
  display: flex; gap: 16px;
}
.badge-pill {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 100px;
  padding: 12px 28px;
  font-size: 28px;
  font-weight: 600;
  color: rgba(240,240,248,0.4);
}
</style>
</head>
<body>

<div class="top-section">
  <div class="eyebrow">Mastermind</div>
  <div class="headline">Break the Code.<br>Beat the Clock.</div>
  <div class="subline">The classic logic game — rebuilt for your pocket.</div>
</div>

<div class="phone-wrap">
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="screen-title">Classic · Hard</div>

      <div class="game-row">
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#f0b429,#E69F00)"></div>
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#7dd3fc,#56B4E9)"></div>
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#34d399,#009E73)"></div>
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#f9a8d4,#CC79A7)"></div>
        <div class="fb-grid"><div class="dot black"></div><div class="dot black"></div><div class="dot gray"></div><div class="dot"></div></div>
      </div>

      <div class="game-row">
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#93c5fd,#0072B2)"></div>
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#34d399,#009E73)"></div>
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#f0b429,#E69F00)"></div>
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#f9a8d4,#CC79A7)"></div>
        <div class="fb-grid"><div class="dot black"></div><div class="dot black"></div><div class="dot black"></div><div class="dot"></div></div>
      </div>

      <div class="game-row active">
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#7dd3fc,#56B4E9)"></div>
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#34d399,#009E73)"></div>
        <div class="peg" style="background:radial-gradient(circle at 35% 30%,#fef08a,#F0E442)"></div>
        <div class="peg-empty"></div>
        <div class="fb-grid"></div>
      </div>

      <div class="game-row">
        <div class="peg-empty"></div><div class="peg-empty"></div><div class="peg-empty"></div><div class="peg-empty"></div>
        <div class="fb-grid"></div>
      </div>

      <div class="color-picker">
        <div class="cp-peg" style="background:radial-gradient(circle at 35% 30%,#f0b429,#E69F00)"></div>
        <div class="cp-peg" style="background:radial-gradient(circle at 35% 30%,#7dd3fc,#56B4E9)"></div>
        <div class="cp-peg" style="background:radial-gradient(circle at 35% 30%,#34d399,#009E73)"></div>
        <div class="cp-peg" style="background:radial-gradient(circle at 35% 30%,#fef08a,#F0E442)"></div>
        <div class="cp-peg" style="background:radial-gradient(circle at 35% 30%,#93c5fd,#0072B2)"></div>
        <div class="cp-peg" style="background:radial-gradient(circle at 35% 30%,#f9a8d4,#CC79A7)"></div>
      </div>
    </div>
  </div>
</div>

<div class="bottom-label">
  <div class="app-name">MASTERMIND: CODE BREAKER</div>
  <div class="store-badge">
    <div class="badge-pill">App Store</div>
    <div class="badge-pill">Google Play</div>
  </div>
</div>

</body>
</html>
